<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Установщик приложений</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="loader">
    <div class="spinner"></div>
    Загрузка установщика...
</div>
<div class="app-wrapper">
    <div class="sidebar">
        <div class="title">Приложения</div>
        <div class="list"></div>
    </div>
    <div class="content">
        <div class="preview-logo"><img id="previewLogo" src="" alt=""></div>
        <div>
            <div class="app-name" id="previewName"></div>
            <div class="app-desc" id="previewDesc"></div>
        </div>
        <div class="hint">Нажмите OK для установки выбранного приложения. Используйте ↑ ↓ для выбора, 0 — сменить тему.</div>
    </div>
</div>
<footer>↑ ↓ — выбор • OK — установить • 0 — тёмная/светлая тема</footer>

<script>
let apps = {};
let items = [];
let index = 0;

function playNav() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "square"; osc.frequency.value = 800;
    gain.gain.value = 0.05;
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.05);
}
function playOk() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "triangle"; osc.frequency.value = 1100;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.09);
}
function setFocus(i) {
    if (i < 0) i = items.length - 1;
    if (i >= items.length) i = 0;
    index = i;
    items.forEach(el => el.classList.remove("focused"));
    items[index].classList.add("focused");
    updatePreview();
    playNav();
}
function updatePreview() {
    const key = items[index].getAttribute("data-app");
    const app = apps[key];
    if (!app) return;
    document.getElementById("previewLogo").src = app.logo;
    document.getElementById("previewName").textContent = app.name;
    document.getElementById("previewDesc").textContent = app.desc;
}
function install(app) {
    try {
        Hisense_installApp(app.appid, app.name, app.icon72, app.icon180, app.icon512, app.url, function () {
            playOk();
            alert(app.name + " установлено!");
        });
    } catch (e) {
        alert("Откройте эту страницу в браузере ТВ Hisense.\n" + e);
    }
}
document.addEventListener("keydown", e => {
    if (e.keyCode === 38) setFocus(index - 1); // up
    else if (e.keyCode === 40) setFocus(index + 1); // down
    else if (e.keyCode === 13) { // OK
        const appKey = items[index].getAttribute("data-app");
        install(apps[appKey]);
    } else if (e.keyCode === 48) document.body.classList.toggle("light");
});
function renderList() {
    const list = document.querySelector(".list");
    list.innerHTML = "";
    Object.keys(apps).forEach((key, i) => {
        const app = apps[key];
        const div = document.createElement("div");
        div.className = "item" + (i === 0 ? " focused" : "");
        div.setAttribute("data-app", key);
        div.innerHTML = `<img src="${app.icon72}" alt=""> ${app.name}`;
        div.addEventListener("click", () => {
            setFocus(i);
            install(app);
        });
        list.appendChild(div);
    });
    items = document.querySelectorAll(".item");
}
window.onload = () => {
    setTimeout(() => document.getElementById("loader").classList.add("hidden"), 1600);
    fetch("api/apps.json").then(r => r.json()).then(data => {
        apps = data;
        renderList();
        updatePreview();
    });
};
</script>
</body>
</html>
