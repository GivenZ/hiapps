    </div>
</div>

<footer>↑ ↓ — выбор • OK — установить • 0 — тема</footer>

var items = [];
var index = 0;
var audioCtx = null;

function getAudioCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

function playNav() {
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "square";
    osc.frequency.value = 800;
    gain.gain.value = 0.05;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.05);
}

function playOk() {
    var ctx = getAudioCtx();
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "triangle";
    osc.frequency.value = 1100;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.06, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.08);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.09);
}

function setFocus(i) {
    if (!items.length) return;

    if (i < 0) i = items.length - 1;
    if (i >= items.length) i = 0;

    index = i;

    for (var j = 0; j < items.length; j++) {
        items[j].classList.remove("focused");
    }

    items[index].classList.add("focused");

    updatePreview();
    playNav();

    if (items[index].scrollIntoView) {
        items[index].scrollIntoView({ block: "nearest" });
    }
}

function updatePreview() {
    if (!items.length) return;

    var key = items[index].getAttribute("data-app");
    var app = apps[key];
    if (!app) return;

    document.getElementById("previewLogo").src = app.logo;
    document.getElementById("previewName").innerHTML = app.name;
    document.getElementById("previewDesc").innerHTML = app.desc;
}

function install(app) {
    try {
        if (typeof Hisense_installApp === "function") {
            Hisense_installApp(
                app.appid,
                app.name,
                app.icon72,
                app.icon180,
                app.icon512,
                app.url,
                function () {
                    playOk();
                    alert(app.name + " установлено!");
                }
            );
        } else {
            alert("Откройте страницу на ТВ Hisense");
        }
    } catch (e) {
        alert("Ошибка: " + e.message);
    }
}

function renderList() {
    var list = document.querySelector(".list");
    if (!list) return;

    list.innerHTML = "";

    for (var key in apps) {
        if (!apps.hasOwnProperty(key)) continue;

        var app = apps[key];

        var div = document.createElement("div");
        div.className = "item";
        div.setAttribute("data-app", key);

        div.innerHTML = "<img src='" + app.icon72 + "'> " + app.name;

        div.onclick = (function (k, a, i) {
            return function () {
                setFocus(i);
                install(a);
            };
        })(key, app, Object.keys(apps).indexOf(key));

        list.appendChild(div);
    }

    items = document.querySelectorAll(".item");

    if (items.length > 0) {
        items[0].classList.add("focused");
    }
}

document.addEventListener("keydown", function (e) {
    if (e.keyCode === 38) {
        setFocus(index - 1);
    } else if (e.keyCode === 40) {
        setFocus(index + 1);
    } else if (e.keyCode === 13) {
        if (!items.length) return;
        var key = items[index].getAttribute("data-app");
        install(apps[key]);
    } else if (e.keyCode === 48) {
        document.body.classList.toggle("light");
    }
});

window.onload = function () {
    renderList();
    updatePreview();

    setTimeout(function () {
        var loader = document.getElementById("loader");
        if (loader) loader.classList.add("hidden");
    }, 1000);
};
</script>
</body>
</html>
